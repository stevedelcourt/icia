<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunGradient3D" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#3a5f6f"/>
      <stop offset="50%" stopColor="#264653"/>
      <stop offset="100%" stopColor="#0f1a1f"/>
    </radialGradient>
    
    <radialGradient id="planetGradient3D" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#5ee7d8"/>
      <stop offset="100%" stopColor="#2A9D8F"/>
    </radialGradient>
    
    <radialGradient id="orb2Gradient3D" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#a8d4a8"/>
      <stop offset="100%" stopColor="#6d9160"/>
    </radialGradient>
    
    <radialGradient id="orb3aGradient3D" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#ffc078"/>
      <stop offset="100%" stopColor="#d4884a"/>
    </radialGradient>
    
    <radialGradient id="orb3bGradient3D" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#ff8a7a"/>
      <stop offset="100%" stopColor="#c4553d"/>
    </radialGradient>
    
    <radialGradient id="orb3cGradient3D" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#85c0f9"/>
      <stop offset="100%" stopColor="#4c8acc"/>
    </radialGradient>
    
    <radialGradient id="orb3dGradient3D" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#e06b64"/>
      <stop offset="100%" stopColor="#9a3c35"/>
    </radialGradient>

    <filter id="glow3D" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="planetShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      @keyframes orbitRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      .sun-glow { animation: pulse 3s ease-in-out infinite; }
      .planet-float { animation: float 4s ease-in-out infinite; }
      .planet-float-delay1 { animation: float 4s ease-in-out infinite; animation-delay: 0.5s; }
      .planet-float-delay2 { animation: float 4s ease-in-out infinite; animation-delay: 1s; }
      .planet-float-delay3 { animation: float 4s ease-in-out infinite; animation-delay: 1.5s; }
      .orbit-ring { animation: orbitRotate 60s linear infinite; transform-origin: 500px 350px; }
      .orbit-ring-reverse { animation: orbitRotate 80s linear infinite reverse; transform-origin: 500px 350px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#F0EEE6"/>

  {/* Starfield background */}
  <g opacity="0.3">
    <circle cx="100" cy="100" r="1" fill="#264653">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="150" r="1.5" fill="#264653">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="550" r="1" fill="#264653">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="600" r="1.2" fill="#264653">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="350" r="1" fill="#264653">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="400" r="1" fill="#264653">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  {/* 3D Orbit rings - back */}
  <ellipse cx="500" cy="350" rx="180" ry="55" fill="none" stroke="#264653" stroke-width="1" opacity="0.15" stroke-dasharray="4,4"/>
  <ellipse cx="500" cy="350" rx="320" ry="98" fill="none" stroke="#264653" stroke-width="1" opacity="0.12" stroke-dasharray="4,4"/>
  <ellipse cx="500" cy="350" rx="450" ry="138" fill="none" stroke="#264653" stroke-width="1" opacity="0.1" stroke-dasharray="4,4"/>

  {/* Animated orbit particles */}
  <g class="orbit-ring" opacity="0.2">
    <circle cx="320" cy="350" r="4" fill="#264653"/>
    <circle cx="680" cy="350" r="4" fill="#264653"/>
    <circle cx="500" cy="170" r="4" fill="#264653"/>
    <circle cx="500" cy="530" r="4" fill="#264653"/>
  </g>

  {/* Back planets (behind sun) */}
  <g transform="translate(380, 280)" class="planet-float" opacity="0.85">
    <ellipse cx="0" cy="0" rx="40" ry="40" fill="url(#planetGradient3D)" filter="url(#planetShadow)"/>
    <ellipse cx="-8" cy="-12" rx="12" ry="8" fill="white" opacity="0.3"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Think</text>
    <text x="0" y="16" text-anchor="middle" fill="white" font-size="8">Tank</text>
  </g>

  <g transform="translate(280, 320)" class="planet-float-delay2" opacity="0.85">
    <ellipse cx="0" cy="0" rx="38" ry="38" fill="url(#orb2Gradient3D)" filter="url(#planetShadow)"/>
    <ellipse cx="-8" cy="-10" rx="10" ry="7" fill="white" opacity="0.3"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="8" font-weight="bold">Centres</text>
    <text x="0" y="15" text-anchor="middle" fill="white" font-size="7">Formation</text>
  </g>

  {/* Center Sun - ICIA */}
  <g class="sun-glow" filter="url(#glow3D)">
    <circle cx="500" cy="350" r="65" fill="url(#sunGradient3D)"/>
    <circle cx="500" cy="350" r="55" fill="#264653"/>
    {/* 3D effect on sun */}
    <ellipse cx="480" cy="330" rx="20" ry="15" fill="white" opacity="0.15"/>
    <text x="500" y="345" text-anchor="middle" fill="white" font-size="16" font-weight="bold">ICIA</text>
    <text x="500" y="362" text-anchor="middle" fill="#aaa" font-size="7">Institut</text>
    <text x="500" y="372" text-anchor="middle" fill="#aaa" font-size="7">Collectif de l'IA</text>
  </g>

  {/* Front planets */}
  <g transform="translate(610, 310)" class="planet-float-delay1">
    <ellipse cx="0" cy="0" rx="42" ry="42" fill="url(#planetGradient3D)" filter="url(#planetShadow)"/>
    <ellipse cx="-10" cy="-12" rx="12" ry="8" fill="white" opacity="0.3"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Lab</text>
    <text x="0" y="16" text-anchor="middle" fill="white" font-size="8">+ Équipe</text>
  </g>

  <g transform="translate(560, 440)" class="planet-float-delay2">
    <ellipse cx="0" cy="0" rx="40" ry="40" fill="url(#planetGradient3D)" filter="url(#planetShadow)"/>
    <ellipse cx="-10" cy="-12" rx="11" ry="7" fill="white" opacity="0.3"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Academia</text>
  </g>

  <g transform="translate(440, 420)" class="planet-float-delay3">
    <ellipse cx="0" cy="0" rx="40" ry="40" fill="url(#planetGradient3D)" filter="url(#planetShadow)"/>
    <ellipse cx="-10" cy="-12" rx="11" ry="7" fill="white" opacity="0.3"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Formation</text>
  </g>

  {/* Orbit 3 - External */}
  <g transform="translate(70, 380)" class="planet-float">
    <ellipse cx="0" cy="0" rx="50" ry="50" fill="url(#orb3aGradient3D)" filter="url(#planetShadow)"/>
    <ellipse cx="-12" cy="-15" rx="14" ry="9" fill="white" opacity="0.25"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Public</text>
    <text x="0" y="18" text-anchor="middle" fill="white" font-size="8">Financement</text>
  </g>

  <g transform="translate(840, 160)" class="planet-float-delay1">
    <ellipse cx="0" cy="0" rx="50" ry="50" fill="url(#orb3bGradient3D)" filter="url(#planetShadow)"/>
    <ellipse cx="-12" cy="-15" rx="14" ry="9" fill="white" opacity="0.25"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Entreprises</text>
    <text x="0" y="18" text-anchor="middle" fill="white" font-size="8">Innovation</text>
  </g>

  <g transform="translate(780, 530)" class="planet-float-delay2">
    <ellipse cx="0" cy="0" rx="48" ry="48" fill="url(#orb3cGradient3D)" filter="url(#planetShadow)"/>
    <ellipse cx="-11" cy="-14" rx="13" ry="8" fill="white" opacity="0.25"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Collectivités</text>
    <text x="0" y="17" text-anchor="middle" fill="white" font-size="7">Observation</text>
  </g>

  <g transform="translate(500, 590)" class="planet-float-delay3">
    <ellipse cx="0" cy="0" rx="50" ry="50" fill="url(#orb3dGradient3D)" filter="url(#planetShadow)"/>
    <ellipse cx="-12" cy="-15" rx="14" ry="9" fill="white" opacity="0.25"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Apprenants</text>
    <text x="0" y="18" text-anchor="middle" fill="white" font-size="8">Upskilling</text>
  </g>

  {/* Front orbit rings */}
  <ellipse cx="500" cy="350" rx="180" ry="55" fill="none" stroke="#264653" stroke-width="1.5" opacity="0.2"/>
  <ellipse cx="500" cy="350" rx="320" ry="98" fill="none" stroke="#264653" stroke-width="1.5" opacity="0.15"/>
  <ellipse cx="500" cy="350" rx="450" ry="138" fill="none" stroke="#264653" stroke-width="1.5" opacity="0.12"/>

  {/* Labels */}
  <g fill="#666" font-size="9" font-weight="bold">
    <text x="690" y="280" opacity="0.5">Orbite 1</text>
    <text x="390" y="260" opacity="0.4">Orbite 2</text>
    <text x="930" y="350" opacity="0.4">Orbite 3</text>
  </g>

  {/* Legend */}
  <g transform="translate(30, 640)">
    <text font-size="11" fill="#5c5c5c" font-weight="bold">Légende :</text>
    <ellipse cx="90" cy="0" rx="12" ry="12" fill="url(#sunGradient3D)"/>
    <text x="115" y="4" font-size="10" fill="#5c5c5c">ICIA</text>
    <ellipse cx="190" cy="0" rx="12" ry="12" fill="url(#planetGradient3D)"/>
    <text x="215" y="4" font-size="10" fill="#5c5c5c">Pôles internes</text>
    <ellipse cx="340" cy="0" rx="12" ry="12" fill="url(#orb2Gradient3D)"/>
    <text x="365" y="4" font-size="10" fill="#5c5c5c">Orbite 2</text>
    <ellipse cx="470" cy="0" rx="12" ry="12" fill="url(#orb3aGradient3D)"/>
    <text x="495" y="4" font-size="10" fill="#5c5c5c">Orbite 3</text>
  </g>

  <text x="500" y="685" text-anchor="middle" fill="#999" font-size="8" font-style="italic">
    Vue 3D Interactive - Système solaire ICIA
  </text>
</svg>
